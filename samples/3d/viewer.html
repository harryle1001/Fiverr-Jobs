<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURÉA — Interactive 3D Product Viewer</title>
<style>
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 40%,#4a1d3a,#120b12 70%);color:#fbf1ea;font-family:Georgia,serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.ui{position:fixed;left:0;right:0;pointer-events:none;text-align:center}
.top{top:5vh}.top h1{margin:0;font-weight:400;letter-spacing:.5em;font-size:clamp(22px,4vw,44px)}
.top p{margin:8px 0 0;font:12px Arial;letter-spacing:.4em;color:#d9b46a}
.bot{bottom:5vh;pointer-events:auto}
.bot button{width:34px;height:34px;border-radius:50%;border:2px solid #fff8;margin:0 8px;cursor:pointer;transition:.3s}
.bot button:hover,.bot button.on{transform:scale(1.25);border-color:#fff}
.bot small{display:block;margin-top:14px;font:11px Arial;letter-spacing:.3em;color:#bfa7b3}
</style></head><body><canvas id="c"></canvas>
<div class="ui top"><h1>AURÉA</h1><p>EAU DE PARFUM · 3D PRODUCT DEMO</p></div>
<div class="ui bot"><div id="sw"></div><small>DRAG TO ROTATE · SCROLL TO ZOOM · PICK A COLOR</small></div>
<script type="module">
import {createScene} from './scene.js';import {OrbitControls} from './lib/OrbitControls.js';
const c=document.getElementById('c');
const s=createScene(c,innerWidth,innerHeight,{dpr:Math.min(devicePixelRatio,2)});
s.camera.position.set(0,2.6,12.5);const ctl=new OrbitControls(s.camera,c);ctl.target.set(0,1.5,0);
ctl.enableDamping=true;ctl.autoRotate=true;ctl.autoRotateSpeed=2;ctl.minDistance=6;ctl.maxDistance=18;ctl.maxPolarAngle=Math.PI/2.05;ctl.enablePan=false;
const cols=[['#e08a52','Amber'],['#d9578a','Rose'],['#3fae8c','Emerald'],['#4a7fd9','Sapphire']];
cols.forEach(([h,n],i)=>{const b=document.createElement('button');b.style.background=h;b.title=n;if(!i)b.className='on';
 b.onclick=()=>{s.setLiquid(h);document.querySelectorAll('#sw button').forEach(x=>x.classList.remove('on'));b.classList.add('on')};sw.appendChild(b)});
addEventListener('resize',()=>s.setSize(innerWidth,innerHeight));
(function l(){ctl.update();s.draw();requestAnimationFrame(l)})();
</script></body></html>
